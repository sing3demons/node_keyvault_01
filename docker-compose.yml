services:
  mongo:
    image: mongo:8
    container_name: keyvault-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Azure Key Vault emulator (https://github.com/nagyesta/lowkey-vault)
  # Optional relational backend for auth (AUTH_DB=postgres)
  postgres:
    image: postgres:17-alpine
    container_name: keyvault-postgres
    environment:
      POSTGRES_USER: keyvault
      POSTGRES_PASSWORD: keyvault
      POSTGRES_DB: keyvault
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyvault"]
      interval: 5s
      timeout: 3s
      retries: 20

  keyvault:
    image: nagyesta/lowkey-vault:7.3.145
    container_name: keyvault-emulator
    environment:
      # Azure SDK requires the vault host to be a subdomain of the challenge resource:
      # primary.localhost  ends with  .localhost
      LOWKEY_ARGS: --LOWKEY_AUTH_RESOURCE=localhost
    networks:
      default:
        aliases:
          - primary.localhost # built-in vault: https://primary.localhost:8443
    ports:
      - "8443:8443" # Key Vault API (HTTPS, self-signed cert)
      - "8080:8080" # fake managed identity token endpoint
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/metadata/identity/oauth2/token?resource=https://localhost:8443"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Catches outgoing email for local dev: SMTP on :1025, web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: keyvault-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  app:
    build: .
    container_name: keyvault-app
    env_file:
      - .env
    environment:
      SECRET_PROVIDER: azure
      AZURE_KEYVAULT_URL: https://primary.localhost:8443
      # DefaultAzureCredential -> ManagedIdentityCredential -> emulator token endpoint
      IDENTITY_ENDPOINT: http://keyvault:8080/metadata/identity/oauth2/token
      IDENTITY_HEADER: header
      # emulator uses a self-signed certificate (local dev only!)
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      # auth storage: mongo | postgres
      AUTH_DB: ${AUTH_DB:-mongo}
      MONGO_URL: mongodb://mongo:27017
      DATABASE_URL: postgres://keyvault:keyvault@postgres:5432/keyvault
      SMTP_URL: smtp://mailpit:1025
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      keyvault:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
  postgres-data:
